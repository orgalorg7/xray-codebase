name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      # xray checks its own architecture: no import cycles, layering rules in .xray.json.
      - run: node packages/cli/dist/bin.js check --format github --no-git
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - run: pnpm --filter xray-codebase build && pnpm --filter xray-codebase smoke
      # The VS Code extension inside a real (downloaded) VS Code, on a virtual display.
      - run: xvfb-run -a pnpm --filter xray-vscode test:vscode
      - run: pnpm --filter xray-vscode package
