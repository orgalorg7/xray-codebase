name: Pages

# The gallery at https://<owner>.github.io/<repository>/: maps of the repositories in
# packages/site/repos.json, rebuilt weekly (so they follow each project), on changes and on request.
on:
  push:
    branches: [main]
    paths: ["packages/**", "pnpm-lock.yaml", ".github/workflows/pages.yml"]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@xray/site... --filter=@xray/ui
      - run: node packages/site/dist/main.js build --out _site --home "$GITHUB_REPOSITORY"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
