name: Blast radius

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  impact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The comparison starts where the branch left its base.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile && pnpm build
      # xray comments on its own pull requests, with the CLI from this checkout.
      - uses: ./pr-impact
        with:
          cli: node ${{ github.workspace }}/packages/cli/dist/bin.js
